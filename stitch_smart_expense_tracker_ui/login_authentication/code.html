<script>
  (function() {
    // Mode Switch Interaction
    const tabSignIn = document.getElementById('tab-signin');
    const tabRegister = document.getElementById('tab-register');
    const submitBtn = document.getElementById('submit-auth-btn');

    if (tabSignIn && tabRegister && submitBtn) {
      tabSignIn.addEventListener('click', () => {
        tabSignIn.className = "flex-1 py-1.5 text-center font-label-md text-label-md rounded-md bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150";
        tabRegister.className = "flex-1 py-1.5 text-center font-label-md text-label-md rounded-md text-on-surface-variant hover:text-on-surface transition-all duration-150";
        submitBtn.innerHTML = '<span>Sign In to Tracker</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.className = "flex-1 py-1.5 text-center font-label-md text-label-md rounded-md bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150";
        tabSignIn.className = "flex-1 py-1.5 text-center font-label-md text-label-md rounded-md text-on-surface-variant hover:text-on-surface transition-all duration-150";
        submitBtn.innerHTML = '<span>Create Free Account</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      });
    }

    // Password Reveal Interaction
    const pwdInput = document.getElementById('auth-password');
    const togglePwdBtn = document.getElementById('toggle-password-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (pwdInput && togglePwdBtn && pwdIcon) {
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Dark Mode Local Container Preview Toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeThumb = document.getElementById('theme-thumb');
    const authContainer = document.getElementById('auth-container');
    let isDark = false;

    if (themeToggle && themeThumb && authContainer) {
      themeToggle.addEventListener('click', () => {
        isDark = !isDark;
        themeToggle.setAttribute('aria-checked', String(isDark));
        
        if (isDark) {
          themeThumb.classList.remove('translate-x-0');
          themeThumb.classList.add('translate-x-3.5');
          document.documentElement.classList.add('dark');
        } else {
          themeThumb.classList.remove('translate-x-3.5');
          themeThumb.classList.add('translate-x-0');
          document.documentElement.classList.remove('dark');
        }
      });
    }
  })();
