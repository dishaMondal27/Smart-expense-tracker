<!-- Inline Micro-interactions Script -->
<script>
    (function initExpenseForm() {
      // Amount Formatting Micro-interaction
      const amountInput = document.getElementById('heroAmountInput');
      if (amountInput) {
        amountInput.addEventListener('focus', function() {
          if (this.value === '0.00') this.value = '';
        });
        amountInput.addEventListener('blur', function() {
          if (!this.value.trim()) this.value = '0.00';
        });
      }

      // Merchant clear button
      const clearBtn = document.getElementById('clearMerchant');
      const merchantInput = document.getElementById('merchantInput');
      if (clearBtn && merchantInput) {
        clearBtn.addEventListener('click', function() {
          merchantInput.value = '';
          merchantInput.focus();
        });
      }

      // Category toggle dropdown
      const categoryTrigger = document.getElementById('categoryTrigger');
      const categoryDrawer = document.getElementById('categoryDrawer');
      const selectedCategoryLabel = document.getElementById('selectedCategoryLabel');

      if (categoryTrigger && categoryDrawer) {
        categoryTrigger.addEventListener('click', function(e) {
          e.stopPropagation();
          categoryDrawer.classList.toggle('hidden');
        });

        document.querySelectorAll('.category-option').forEach(btn => {
          btn.addEventListener('click', function() {
            const catName = this.getAttribute('data-cat');
            if (selectedCategoryLabel) {
              selectedCategoryLabel.textContent = catName;
            }
            categoryDrawer.classList.add('hidden');
          });
        });

        document.addEventListener('click', function(e) {
          if (!categoryDrawer.contains(e.target) && !categoryTrigger.contains(e.target)) {
            categoryDrawer.classList.add('hidden');
          }
        });
      }

      // Payment Method Pills Selection
      const pills = document.querySelectorAll('.payment-pill');
      pills.forEach(pill => {
        pill.addEventListener('click', function() {
          pills.forEach(p => {
            p.classList.remove('bg-on-surface', 'text-surface-container-lowest');
            p.classList.add('bg-surface-container-low', 'text-secondary');
          });
          this.classList.remove('bg-surface-container-low', 'text-secondary');
          this.classList.add('bg-on-surface', 'text-surface-container-lowest');
        });
      });

      // Receipt trigger
      const receiptDropzone = document.getElementById('receiptDropzone');
      const receiptFileInput = document.getElementById('receiptFileInput');
      if (receiptDropzone && receiptFileInput) {
        receiptDropzone.addEventListener('click', () => receiptFileInput.click());
      }

      // Save animation feedback
      const saveBtn = document.getElementById('saveExpensePrimary');
      const quickSave = document.getElementById('quickSaveBtn');
      const triggerSave = () => {
        if (!saveBtn) return;
        const origText = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Saved!</span>';
        saveBtn.classList.add('bg-primary-container');
        setTimeout(() => {
          saveBtn.innerHTML = origText;
          saveBtn.classList.remove('bg-primary-container');
        }, 1200);
      };

      if (saveBtn) saveBtn.addEventListener('click', triggerSave);
      if (quickSave) quickSave.addEventListener('click', triggerSave);
    })();
  </script>
