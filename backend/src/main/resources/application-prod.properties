# ==============================================================================
# Smart Expense Tracker - Production Profile Configuration (application-prod.properties)
# ==============================================================================
# Activate this profile via:
#   SPRING_PROFILES_ACTIVE=prod
# or:
#   java -Dspring.profiles.active=prod -jar smartexpense.jar
#
# All sensitive credentials and secrets MUST be provided via Environment Variables.
# ==============================================================================

# Server Configuration
server.port=${PORT:8080}

# Application Info
spring.application.name=smartexpense

# Production Database Connection (MySQL)
# Strictly read from environment variables - NO hardcoded fallback values
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' automatically applies non-destructive schema changes; use 'validate' if using Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Authentication
# Must be at least 256 bits (32 bytes) hex-encoded or Base64 secret supplied strictly from environment
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
# Comma-separated allowed frontend domains (e.g. https://your-expense-app.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smart-expense-tracker-three-red.vercel.app,http://localhost:5173,http://127.0.0.1:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartexpense=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
